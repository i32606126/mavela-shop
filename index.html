<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAVÉLA — Maison de Couture</title>
    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #c5a880;
            --bg: #fcfbf9;
            --border: #e5e5e5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background: var(--bg); color: var(--primary); line-height: 1.6; }
        
        header { border-bottom: 1px solid var(--border); padding: 20px 0; background: #fff; text-align: center; }
        .logo { font-family: serif; font-size: 28px; letter-spacing: 3px; font-weight: bold; text-decoration: none; color: var(--primary); }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        h1 { font-family: serif; font-size: 32px; text-align: center; margin-bottom: 40px; }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .product-card { background: #fff; border: 1px solid var(--border); padding: 15px; text-align: center; }
        .product-card img { width: 100%; height: 380px; object-fit: cover; margin-bottom: 15px; }
        .product-title { font-size: 15px; font-weight: 500; margin-bottom: 8px; }
        .product-price { font-size: 14px; color: var(--accent); font-weight: 600; margin-bottom: 15px; display: block; }
        
        .btn-order { background: var(--primary); color: #fff; border: none; padding: 12px 20px; width: 100%; font-size: 12px; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; transition: background 0.3s; }
        .btn-order:hover { background: var(--accent); }

        /* Modal Popup */
        #orderModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: #fff; width: 90%; max-width: 450px; padding: 30px; border: 1px solid var(--border); position: relative; }
        .close-modal { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 20px; cursor: pointer; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 11px; letter-spacing: 1px; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border); font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">MAVÉLA</a>
    </header>

    <div class="container">
        <h1>Nos Créations Exclusives</h1>
        
        <div class="products-grid">
            <!-- استبدلي هذا المنتج بمنتجاتك الحقيقية -->
            <div class="product-card">
                <img src="رابط_صورتك_هنا.jpg" alt="اسم منتجك">
                <div class="product-title">اسم منتجك الحقيقي</div>
                <span class="product-price">0,000 DZD</span>
                <button class="btn-order" onclick="openModal('اسم منتجك الحقيقي', '0,000 DZD')">Commander sur WhatsApp</button>
            </div>
        </div>
    </div>

    <!-- نافذة إتمام الطلب للواتساب -->
    <div id="orderModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">✕</button>
            <h3 id="modalProductName" style="font-family: serif; margin-bottom: 15px; font-size: 20px;">Commander</h3>
            
            <div class="form-group">
                <label>NOM ET PRÉNOM</label>
                <input type="text" id="clientName" placeholder="Ex: Amina Benali">
            </div>
            <div class="form-group">
                <label>TÉLÉPHONE</label>
                <input type="tel" id="clientPhone" placeholder="Ex: 0661000000">
            </div>
            <div class="form-group">
                <label>WILAYA</label>
                <select id="clientWilaya">
                    <option value="16 - Alger">16 - Alger</option>
                    <option value="35 - Boumerdès">35 - Boumerdès</option>
                    <option value="09 - Blida">09 - Blida</option>
                    <option value="Autre Wilaya">Autre Wilaya (58 Wilayas)</option>
                </select>
            </div>
            <div class="form-group">
                <label>TAILLE</label>
                <select id="clientSize">
                    <option value="S">S</option>
                    <option value="M" selected>M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                </select>
            </div>
            <div class="form-group">
                <label>COULEUR</label>
                <select id="clientColor">
                    <option value="Noir">Noir</option>
                    <option value="Beige">Beige</option>
                    <option value="Blanc">Blanc</option>
                </select>
            </div>

            <button class="btn-order" onclick="sendToWhatsApp()" style="margin-top: 10px; background: #25d366;">VALIDER LA COMMANDE (WHATSAPP)</button>
        </div>
    </div>

    <script>
        let currentProduct = '';
        let currentPrice = '';

        function openModal(name, price) {
            currentProduct = name;
            currentPrice = price;
            document.getElementById('modalProductName').innerText = "Commander: " + name;
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        function sendToWhatsApp() {
            let name = document.getElementById('clientName').value;
            let phone = document.getElementById('clientPhone').value;
            let wilaya = document.getElementById('clientWilaya').value;
            let size = document.getElementById('clientSize').value;
            let color = document.getElementById('clientColor').value;

            if(!name || !phone) {
                alert('Veuillez remplir votre nom et numéro de téléphone.');
                return;
            }

            // ضعي رقم واتساب الخاص بك هنا (مثال: 213600000000)
            let myPhoneNumber = "213600000000"; 

            let message = `Bonjour MAVÉLA,%0A%0AJe souhaite commander:%0A- Produit: ${currentProduct}%0A- Prix: ${currentPrice}%0A- Taille: ${size}%0A- Couleur: ${color}%0A%0AInformations de livraison:%0A- Nom: ${name}%0A- Téléphone: ${phone}%0A- Wilaya: ${wilaya}`;

            window.open(`https://wa.me/${myPhoneNumber}?text=${message}`, '_blank');
        }
    </script>
</body>
</html>
